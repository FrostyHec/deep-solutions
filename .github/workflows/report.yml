# =============================================================================
# Test Report Workflow - Publish test results to PR
# Trigger: After CI workflow completes
# Features: Download test results and publish to PR using test-reporter
# Strategy: Dynamically adjust test versions based on trigger (PR reports 3.8 only, main reports all)
# Security: This workflow runs in main repository context, safe to use write permissions
# =============================================================================

name: Test Report

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  checks: write          # Create/update Check Run
  pull-requests: write   # Comment in PR
  actions: read          # Read workflow run info

jobs:
  report:
    name: Publish Test Results
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    
    strategy:
      matrix:
        # Decide which versions to report based on trigger event
        # main branch: full matrix, PR: 3.8 only
        python-version: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && fromJSON('["3.8", "3.9", "3.10", "3.11", "3.12"]') || fromJSON('["3.8"]') }}
    
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}-${{ github.event.workflow_run.id }}
          path: test-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: PyTest Results (Python ${{ matrix.python-version }})
          path: test-results/pytest-report.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
          list-suites: all
          list-tests: all
          max-annotations: 10
