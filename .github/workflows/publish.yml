# =============================================================================
# Publish to PyPI
# Trigger: Manual workflow dispatch (workflow_dispatch)
# Features:
#   1. Run full test suite
#   2. Build distribution package
#   3. Publish to PyPI (using API Token)
#   4. Verify installation
#   5. Create GitHub Release
#
# Usage Instructions:
#   1. Prerequisites:
#      - Generate API Token on PyPI account: https://pypi.org/manage/account/tokens/
#      - In GitHub repository Settings > Secrets and variables > Actions, add:
#        - Name: PYPI_API_TOKEN
#        - Secret: <your-pypi-api-token>
#      - Ensure PYPI_API_TOKEN secret is configured in the environment
#
#   2. Trigger Publishing:
#      - Go to GitHub Actions page and select this workflow
#      - Click "Run workflow"
#      - Enter version tag (e.g., v1.0.0, v0.1.1, v2.0.0rc1)
#      - Click "Run workflow"
#
#   3. The workflow will automatically:
#      - Run tests on all Python versions
#      - Build sdist and wheel distributions
#      - Publish to PyPI
#      - Create GitHub Release
# =============================================================================

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to publish (e.g., v1.0.0, v0.1.1, v2.0.0rc1)'
        required: true
        type: string

jobs:
  # ===========================================================================
  # First run complete test suite
  # ===========================================================================
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short

  # ===========================================================================
  # Publish to PyPI
  # ===========================================================================
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    environment: pypi
    
    permissions:
      contents: write  # For creating release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # setuptools-scm requires complete git history

      - name: Create git tag (if not exists)
        run: |
          TAG="${{ github.event.inputs.version_tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"
          else
            echo "Tag already exists: $TAG"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI (using API Token)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_NON_INTERACTIVE: 1
        run: twine upload dist/* --skip-existing

      - name: Wait for package to be available
        run: sleep 60

      - name: Test installation from PyPI
        run: |
          # Create new virtual environment for testing
          python -m venv test-env
          source test-env/bin/activate
          
          # Install from PyPI
          pip install deep-solutions
          
          # Verify installation
          python -c "import deep_solutions; print(f'Version: {deep_solutions.__version__}')"
          python -c "from deep_solutions import hello_world; print(hello_world())"
          
          deactivate

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${{ github.event.inputs.version_tag }}" | sed 's/^v//' >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: Release ${{ github.event.inputs.version_tag }}
          body: |
            ## deep-solutions ${{ github.event.inputs.version_tag }}
            
            ### Installation
            
            ```bash
            pip install deep-solutions==${{ steps.get_version.outputs.VERSION }}
            ```
            
            ### Changelog
            
            See [CHANGELOG.md](https://github.com/FrostyHec/deep-solutions/blob/main/CHANGELOG.md) for details.
          files: |
            dist/*
          draft: false
          prerelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-pypi
          path: dist/
