[build-system]
requires = ["setuptools>=64", "setuptools-scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-solutions"
dynamic = ["version"]
description = "A Python package for deep learning solutions"
readme = "README.md"
authors = [
    {name = "ZDHuang", email = "your.email@example.com"}
]
keywords = ["deep-learning", "machine-learning", "solutions"]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core dependencies
dependencies = [
    "numpy>=1.17.0",
    "scipy>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "tox>=4.0.0",
    "tox-gh>=1.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/FrostyHec/deep-solutions"
Documentation = "https://github.com/FrostyHec/deep-solutions/blob/main/README.md"
Repository = "https://github.com/FrostyHec/deep-solutions"
Issues = "https://github.com/FrostyHec/deep-solutions/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["deep_solutions*"]
exclude = ["tests*"]

# ============================================================
# setuptools-scm: 从 Git Tag 自动获取版本号
# ============================================================
[tool.setuptools_scm]
write_to = "src/deep_solutions/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to_template = """# file generated by setuptools-scm
# ruff: noqa
# don't change, don't track in version control

__all__ = [
    \"__version__\",
    \"__version_tuple__\",
    \"version\",
    \"version_tuple\",
]

TYPE_CHECKING = False
if TYPE_CHECKING:
    from typing import Tuple
    from typing import Union

    VERSION_TUPLE = Tuple[Union[int, str], ...]
else:
    VERSION_TUPLE = object

version: str
__version__: str
__version_tuple__: VERSION_TUPLE
version_tuple: VERSION_TUPLE

__version__ = version = {version!r}
__version_tuple__ = version_tuple = {version_tuple!r}
"""

# ============================================================
# Ruff: 代码格式化和 Lint（替代 black/isort/flake8）
# ============================================================
[tool.ruff]
target-version = "py38"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["deep_solutions"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================
# pytest 配置
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=deep_solutions --cov-report=term-missing"

# ============================================================
# mypy 类型检查配置
# ============================================================
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
